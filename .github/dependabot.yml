# Revisión mensual de las acciones fijadas por hash y de las dependencias de pip y de npm: un solo PR
# por ecosistema (el 1 de noviembre de 2026 doce PR de golpe atascaron la CI). TypeScript, sin
# versiones mayores: la 7 no la soporta aún typescript-eslint y tumbaba el PR del grupo (PR 391).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      acciones:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm:
        patterns:
          - "*"
