# Revisión mensual de las acciones fijadas por hash y de las dependencias de pip y de npm: un solo PR
# por ecosistema (el 1 de noviembre de 2026 doce PR de golpe atascaron la CI).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      acciones:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - "*"
