name: vigia-recogida

# Vigilancia del observatorio desde fuera del servidor. Cada 10 minutos lee lo que el servidor
# publica en el almacén público (recogida/salud.py):
#
# - salud.json (recogida/vigilancia.py, cada 5 minutos): si no llega o tiene más de 20 minutos,
#   el servidor no da señales; si trae un problema, es un problema. El servidor solo los pone ahí
#   cuando no se han arreglado solos (3 recogidas seguidas fallidas tras sus reintentos, más de 3
#   horas sin publicar, o un fallo que sigue igual tras los reintentos de su unidad). Sus avisos
#   (en observación, recogida con avisos, titulares retenidos) se enseñan en el resumen sin ser
#   fallo;
# - estado.json (al final de cada recogida): última recogida que publicó (más de 3 horas es
#   problema), exportación semanal (tras sus reintentos) y captura del seguimiento;
# - directo.json: la detección en directo de cierres;
# - el despliegue de producción de la web en Vercel (recogida/despliegue_web.py, secreto
#   EODI_VERCEL_TOKEN): tiene que ser del último commit de main y haber salido bien; si falla, se
#   pide otro una vez; si sigue fallando, es un problema.
#
# Cada problema abre su incidencia (una sola mientras dure) y la cierra al arreglarse: GitHub manda
# al dueño el correo de la incidencia nueva. El trabajo NO falla por un problema del observatorio
# (así no llegan correos de «Run failed» además de la incidencia); solo falla si el propio vigía no
# puede hacer su trabajo, y eso sí conviene que llegue. Lo que se arregló solo va al resumen diario
# privado (recogida/visitas.py, sección SISTEMA), sin correo.
#
# GitHub puede lanzar tarde o saltarse alguna ejecución programada: el aviso llega tarde, pero
# llega. Y desactiva las programaciones de un repositorio público sin actividad en 60 días: una
# vez al día este trabajo vuelve a activar su propio workflow por la API.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Alarma de prueba: hace como si salud.json trajera un problema"
        type: boolean
        default: false

# Leer el código, abrir o cerrar incidencias y reactivar este workflow; nada más.
permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: vigia-recogida
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Salud del servidor, de la recogida, de la exportación y de los servicios en directo
        id: salud
        env:
          PRUEBA: ${{ inputs.prueba }}
        run: |
          set -euo pipefail
          python -m recogida.salud
          if [ "${PRUEBA:-false}" = "true" ]; then
            {
              echo "problema_servidor=true"
              echo "mensaje_servidor=Alarma de prueba lanzada a mano: no hay ningún problema real."
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Despliegue de la web en Vercel
        id: web
        env:
          VERCEL_TOKEN: ${{ secrets.EODI_VERCEL_TOKEN }}
        run: python -m recogida.despliegue_web
      - name: Incidencias
        id: incidencias
        env:
          P_WEB: ${{ steps.web.outputs.problema_web }}
          M_WEB: ${{ steps.web.outputs.mensaje_web }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRUEBA: ${{ inputs.prueba }}
          P_RECOGIDA: ${{ steps.salud.outputs.problema }}
          M_RECOGIDA: ${{ steps.salud.outputs.mensaje }}
          P_EXPORTACION: ${{ steps.salud.outputs.problema_exportacion }}
          M_EXPORTACION: ${{ steps.salud.outputs.mensaje_exportacion }}
          P_DIRECTO: ${{ steps.salud.outputs.problema_directo }}
          M_DIRECTO: ${{ steps.salud.outputs.mensaje_directo }}
          P_SEGUIMIENTO: ${{ steps.salud.outputs.problema_seguimiento }}
          M_SEGUIMIENTO: ${{ steps.salud.outputs.mensaje_seguimiento }}
          P_SERVIDOR: ${{ steps.salud.outputs.problema_servidor }}
          M_SERVIDOR: ${{ steps.salud.outputs.mensaje_servidor }}
        run: |
          set -euo pipefail
          nuevas=0
          problemas=0
          # incidencia <título> <problema> <mensaje> <dónde mirar> <frase de cierre>
          incidencia() {
            local titulo="$1" problema="$2" mensaje="$3" donde="$4" cierre="$5" abierta
            abierta="$(gh issue list --state open --limit 100 --json number,title \
              --jq "map(select(.title == \"$titulo\")) | .[0].number // empty")"
            if [ "$problema" = "true" ]; then
              problemas=$((problemas + 1))
              echo "::error::$titulo: $mensaje"
              if [ -z "$abierta" ]; then
                gh issue create --title "$titulo" \
                  --body "$mensaje Qué hacer: \`docs/operacion.md\` ($donde). Esta incidencia se cierra sola cuando se arregla."
                nuevas=$((nuevas + 1))
              else
                echo "la incidencia #$abierta sigue abierta"
              fi
            elif [ -n "$abierta" ]; then
              gh issue close "$abierta" --comment "$cierre $mensaje"
            fi
          }
          incidencia "La recogida horaria no actualiza la base" "$P_RECOGIDA" "$M_RECOGIDA" \
            "si la recogida falla" "La recogida vuelve a terminar bien."
          incidencia "La exportación semanal no se genera" "$P_EXPORTACION" "$M_EXPORTACION" \
            "exportación semanal" "Vuelve a haber una exportación correcta."
          incidencia "La detección en directo no se actualiza" "$P_DIRECTO" "$M_DIRECTO" \
            "detección en directo" "La detección en directo vuelve a publicar."
          incidencia "La web no se publica en Vercel" "${P_WEB:-false}" "${M_WEB:-}" \
            "si la web no se actualiza" "La compilación de producción vuelve a salir bien."
          incidencia "La captura del seguimiento en directo no recibe datos" "$P_SEGUIMIENTO" \
            "$M_SEGUIMIENTO" "si la captura del seguimiento se para" \
            "La captura del seguimiento vuelve a recibir sin huecos largos."
          titulo_servidor="El servidor del observatorio necesita atención"
          if [ "${PRUEBA:-false}" = "true" ]; then
            titulo_servidor="Alarma de prueba de la vigilancia"
          fi
          incidencia "$titulo_servidor" "$P_SERVIDOR" "$M_SERVIDOR" \
            "cómo ver si todo va bien" "El servidor vuelve a estar bien."
          echo "nuevas=$nuevas" >> "$GITHUB_OUTPUT"
          echo "problemas=$problemas" >> "$GITHUB_OUTPUT"
          echo "problemas: $problemas, incidencias nuevas: $nuevas (el aviso al dueño es la incidencia)"
      # Una vez al día, la pasada de las 06:00 a 06:09: GitHub desactiva las programaciones de un
      # repositorio sin actividad en 60 días, y desde que los datos no van al repositorio puede
      # pasar semanas sin commits.
      - name: Mantener activa la programación
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M | cut -c1-3)" = "060" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/vigia-recogida.yml/enable"
            echo "programación reactivada"
          fi
