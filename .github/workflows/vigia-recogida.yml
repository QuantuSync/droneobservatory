name: vigia-recogida

# Aviso si el servidor deja de recoger. Cada hora lee estado.json, que el servidor publica en
# el almacén público al final de cada recogida (recogida/salud.py): si la última
# recogida correcta tiene más de dos horas, o si el fichero no responde en tres intentos
# espaciados, abre una incidencia en este repositorio (una sola mientras dure el problema)
# y la cierra cuando se recupera. Una recogida que no trae nada nuevo sigue siendo correcta:
# la fecha de la rama estado, que antes se miraba, no avanzaba y daba avisos falsos.
#
# En el minuto 41: lejos de las horas en punto, cuando GitHub más retrasa las ejecuciones
# programadas, y cuando la recogida del minuto 17 ya ha terminado. GitHub puede lanzarla
# tarde o saltarse alguna: el aviso llega tarde, pero llega.
#
# Con el mismo estado.json vigila la exportación semanal para AEGIS: si la última correcta
# tiene más de 8 días, abre otra incidencia («La exportación semanal no se genera»).

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

# Leer el código para comprobar el estado y abrir o cerrar incidencias; nada más.
permissions:
  contents: read
  issues: write

concurrency:
  group: vigia-recogida
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Última recogida correcta según estado.json
        id: salud
        run: python -m recogida.salud
      - name: Abrir o cerrar la incidencia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITULO: La recogida horaria no actualiza la base
          PROBLEMA: ${{ steps.salud.outputs.problema }}
          MENSAJE: ${{ steps.salud.outputs.mensaje }}
        run: |
          set -euo pipefail
          abierta="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITULO)) | .[0].number // empty')"
          if [ "$PROBLEMA" = "true" ]; then
            if [ -z "$abierta" ]; then
              gh issue create --title "$TITULO" --body "$MENSAJE Cómo revisarlo y reconstruirlo: \`docs/servidor.md\`. Esta incidencia se cierra sola cuando la recogida vuelve a terminar bien."
            else
              echo "la incidencia #$abierta sigue abierta"
            fi
          elif [ -n "$abierta" ]; then
            gh issue close "$abierta" --comment "La recogida vuelve a terminar bien. $MENSAJE"
          fi
      # La exportación semanal para AEGIS (servidor/exportacion.sh, los lunes a las 03:47 UTC):
      # otra incidencia si la última correcta tiene más de 8 días o no consta ninguna.
      - name: Abrir o cerrar la incidencia de la exportación
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITULO: La exportación semanal no se genera
          PROBLEMA: ${{ steps.salud.outputs.problema_exportacion }}
          MENSAJE: ${{ steps.salud.outputs.mensaje_exportacion }}
        run: |
          set -euo pipefail
          abierta="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITULO)) | .[0].number // empty')"
          if [ "$PROBLEMA" = "true" ]; then
            if [ -z "$abierta" ]; then
              gh issue create --title "$TITULO" --body "$MENSAJE Cómo revisarla y lanzarla a mano: \`docs/servidor.md\`, «Exportación semanal». Esta incidencia se cierra sola cuando vuelve a haber una exportación correcta."
            else
              echo "la incidencia #$abierta sigue abierta"
            fi
          elif [ -n "$abierta" ]; then
            gh issue close "$abierta" --comment "Vuelve a haber una exportación correcta. $MENSAJE"
          fi
      # La detección en directo de cierres (servidor/directo.sh, siempre en marcha): otra
      # incidencia si directo.json lleva más de media hora sin publicarse o no responde.
      - name: Abrir o cerrar la incidencia de la detección en directo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITULO: La detección en directo no se actualiza
          PROBLEMA: ${{ steps.salud.outputs.problema_directo }}
          MENSAJE: ${{ steps.salud.outputs.mensaje_directo }}
        run: |
          set -euo pipefail
          abierta="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITULO)) | .[0].number // empty')"
          if [ "$PROBLEMA" = "true" ]; then
            if [ -z "$abierta" ]; then
              gh issue create --title "$TITULO" --body "$MENSAJE Cómo revisarla y relanzarla: \`docs/servidor.md\`, «Detección en directo de cierres». Esta incidencia se cierra sola cuando el servicio vuelve a publicar."
            else
              echo "la incidencia #$abierta sigue abierta"
            fi
          elif [ -n "$abierta" ]; then
            gh issue close "$abierta" --comment "La detección en directo vuelve a publicar. $MENSAJE"
          fi
      # La captura del seguimiento en directo (servidor/seguimiento.sh, siempre en marcha): otra
      # incidencia si llevaba más de 10 minutos sin heartbeat del flujo de NEPTUN o si ha tenido un
      # hueco de más de 10 minutos en las dos últimas horas (también si estuvo parada).
      - name: Abrir o cerrar la incidencia de la captura del seguimiento
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITULO: La captura del seguimiento en directo no recibe datos
          PROBLEMA: ${{ steps.salud.outputs.problema_seguimiento }}
          MENSAJE: ${{ steps.salud.outputs.mensaje_seguimiento }}
        run: |
          set -euo pipefail
          abierta="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITULO)) | .[0].number // empty')"
          if [ "$PROBLEMA" = "true" ]; then
            if [ -z "$abierta" ]; then
              gh issue create --title "$TITULO" --body "$MENSAJE Cómo revisarla y relanzarla: \`docs/servidor.md\`, «Captura del seguimiento en directo». Esta incidencia se cierra sola cuando el servicio lleva dos horas recibiendo sin huecos largos."
            else
              echo "la incidencia #$abierta sigue abierta"
            fi
          elif [ -n "$abierta" ]; then
            gh issue close "$abierta" --comment "La captura del seguimiento vuelve a recibir sin huecos largos. $MENSAJE"
          fi
