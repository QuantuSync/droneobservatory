name: prueba-gdelt

# Temporal: recoge en memoria los últimos días de GDELT desde un runner (la API
# rechaza la IP local) para medir el volumen y sacar la muestra del informe. Sin
# secretos ni subida de datos. Se borra antes de mergear.
on:
  push:
    paths:
      - .github/workflows/prueba-gdelt.yml

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -u -m recogida.informe_gdelt --dias 5 --horas 5
