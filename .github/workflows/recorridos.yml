name: recorridos

# Los recorridos de Playwright de la web (web/e2e), en la nube y no en el ordenador de quien
# desarrolla: Chromium y WebKit; Android, iPhone, tableta y escritorio; español e inglés.
#
# - En cada PR que cambia la web, Vercel publica una vista previa y avisa a GitHub con un
#   «deployment_status»: los recorridos van contra esa vista previa (con la clave de acceso de
#   las vistas previas en el secreto EODI_VERCEL_BYPASS).
# - En cada PR que no cambia la web (Vercel no construye: web/scripts/omitir-build.ts), los
#   recorridos van contra producción, que es la web con la que se va a fusionar.
# - Producción se recorre tras el despliegue de cada commit nuevo que cambia la web y cada 6 horas
#   por reloj (schedule). Un commit que no toca nada de lo que construye la web (datos, recogida,
#   documentación; las rutas de web/scripts/omitir-build.ts) no se recorre: desde el 4 de noviembre
#   de 2026 se compara con el último commit recorrido. Los redespliegues de datos del mismo commit
#   (el gancho de despliegue de la recogida horaria añade otro estado «success» al mismo
#   despliegue) tampoco: desde el 27 de octubre de
#   2026, cuando recorrían el mismo commit cada hora y el 97 % de los 1,5 millones de peticiones
#   diarias que recibía Vercel eran de los recorridos. Si fallan, se abre (o se comenta) la
#   incidencia «Los recorridos fallan en producción»; si pasan, se cierra.
# - El mapa de fondo no se descarga de la web en cada prueba: web/e2e/base.ts guarda cada trozo
#   en una carpeta que se conserva entre ejecuciones con la caché de Actions (clave: la huella
#   del mapa en configuracion/almacen_publico.json). Solo la prueba «el mapa de fondo se sirve por
#   la web» (e2e/web.spec.ts) lo pide de verdad. Igual, desde el 4 de noviembre de 2026, el código
#   de /assets/ y los ficheros públicos del mapa (caché «fijos», clave: la huella de esos ficheros
#   del repositorio); los pide de verdad «el código y los contornos se sirven por la web». Los
#   navegadores llevan «EODI-recorrido/1.0» en su agente de usuario (web/e2e/agente.ts).
# - A mano: Actions → recorridos → Run workflow, con la dirección que se quiera.
# - Cuántos trabajos: los 11 de la matriz solo en el despliegue de un commit nuevo de main
#   (Production), en la pasada por reloj y a mano. En los PR (pull_request) y en las vistas previas
#   (deployment_status que no es Production), solo dos: «escritorio-chromium 1/1» y «android 1/1».
#   La matriz la calcula el trabajo «destino» (salida «matriz», JSON) y la lee «recorridos» con
#   fromJSON. Por qué: el 28 de octubre de 2026 el cortafuegos de Vercel medía ≈1,2 millones de
#   peticiones al día, casi todas de estos recorridos; desde el PR 329, 13 de 21 tandas fueron de
#   PR de las sesiones (el PR, su vista previa y cada push), con los 11 trabajos y sin la caché del
#   mapa en las vistas previas. Lo que dos trabajos no cubren lo recorre producción tras fusionar.
#
# Cómo ver los resultados: interno: operacion, «Pruebas en la nube».

on:
  deployment_status:
  pull_request:
  # Producción, cada 6 horas (además de tras cada commit nuevo).
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Dirección de la web que se recorre"
        default: "https://droneobservatory.eu"
        required: true

permissions:
  contents: read

concurrency:
  group: recorridos-${{ github.event_name }}-${{ github.event.deployment.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Contra qué se recorre, o nada: un deployment_status que no es un éxito, un redespliegue de
  # datos de un commit ya recorrido en producción, un commit nuevo que no cambia la web, o un PR que cambia la web (lo recorre su vista
  # previa, que llega después como deployment_status).
  destino:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.decidir.outputs.base }}
      produccion: ${{ steps.decidir.outputs.produccion }}
      sha: ${{ steps.decidir.outputs.sha }}
      matriz: ${{ steps.decidir.outputs.matriz }}
    steps:
      # El historial entero: en los PR, para comparar con su base; en el despliegue de producción de
      # un commit nuevo, para comparar con el último commit recorrido.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.deployment.sha }}
          fetch-depth: 0
      - id: decidir
        env:
          EVENTO: ${{ github.event_name }}
          ESTADO: ${{ github.event.deployment_status.state }}
          ENTORNO: ${{ github.event.deployment.environment }}
          URL_DESPLIEGUE: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          SHA_DESPLIEGUE: ${{ github.event.deployment.sha }}
          BASE_MANUAL: ${{ github.event.inputs.base }}
          BASE_PR: origin/${{ github.event.pull_request.base.ref }}
          SHA_PR: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Lo que construye la web: las rutas de web/scripts/omitir-build.ts (RUTAS_QUE_DESPLIEGAN).
          RUTAS_WEB: web publicacion vercel.json api configuracion/almacen_publico.json configuracion/avisos.json configuracion/publicacion_web.json
        run: |
          set -euo pipefail
          base=""; produccion=false; sha="$GITHUB_SHA"
          case "$EVENTO" in
            deployment_status)
              if [ "$ESTADO" = "success" ]; then
                sha="$SHA_DESPLIEGUE"
                if [ "$ENTORNO" = "Production" ]; then
                  base="https://droneobservatory.eu"; produccion=true
                  # ¿Cambia la web desde el último commit recorrido en producción? Lo dice la
                  # ejecución terminada más reciente (éxito o fallo, no cancelada), tras un despliegue
                  # o por reloj, cuyo trabajo «incidencia» corrió: solo corre tras recorrer
                  # producción. Si el commit es el mismo (un redespliegue de datos) o no toca nada de
                  # lo que construye la web (las mismas rutas que en los PR y que
                  # web/scripts/omitir-build.ts), no corre ningún trabajo: producción sirve la misma
                  # web y la recorre la pasada de cada 6 horas. Desde el 4 de noviembre de 2026:
                  # del 3 al 4, 10 de las 16 pasadas completas tras un despliegue eran de commits de
                  # datos, del cerrojo o de documentación. Ante cualquier duda (la API o git fallan,
                  # no hay ejecución anterior), se recorre.
                  ultimo=""
                  if previas="$(gh api "repos/$GH_REPO/actions/workflows/recorridos.yml/runs?status=completed&per_page=40" \
                      --jq '.workflow_runs[] | select((.event == "deployment_status" or .event == "schedule") and (.conclusion == "success" or .conclusion == "failure")) | "\(.id) \(.head_sha) \(.created_at)"')"; then
                    while read -r id previo creada; do
                      [ -n "$id" ] || continue
                      if corrio="$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" \
                          --jq '[.jobs[] | select(.name == "incidencia" and (.conclusion == "success" or .conclusion == "failure"))] | length')" \
                          && [ "$corrio" != "0" ]; then
                        ultimo="$previo"
                        echo "último commit recorrido en producción: ${previo:0:7} ($(date -u -d "$creada" '+%d/%m %H:%M') UTC)"
                        break
                      fi
                    done <<< "$previas"
                  else
                    echo "::warning::no se pudo consultar el último commit recorrido: se recorre"
                  fi
                  if [ -n "$ultimo" ]; then
                    # shellcheck disable=SC2086
                    if [ "$ultimo" = "$sha" ]; then
                      base=""; produccion=false
                      echo "redespliegue de datos del commit ${sha:0:7}, ya recorrido: producción se recorre cada 6 horas y tras cada commit que cambia la web"
                    elif git cat-file -e "$ultimo^{commit}" 2>/dev/null && git diff --quiet "$ultimo" "$sha" -- $RUTAS_WEB; then
                      base=""; produccion=false
                      echo "el commit ${sha:0:7} no cambia la web desde ${ultimo:0:7}: no se recorre (producción se recorre cada 6 horas)"
                    else
                      echo "el commit ${sha:0:7} cambia la web desde ${ultimo:0:7} (o no se puede comparar): se recorre"
                    fi
                  fi
                else
                  base="$URL_DESPLIEGUE"
                fi
              fi
              ;;
            schedule)
              base="https://droneobservatory.eu"; produccion=true
              ;;
            workflow_dispatch)
              base="$BASE_MANUAL"
              ;;
            pull_request)
              sha="$SHA_PR"
              git fetch --quiet origin "${BASE_PR#origin/}"
              comun="$(git merge-base "$BASE_PR" HEAD)"
              # shellcheck disable=SC2086
              if git diff --quiet "$comun" HEAD -- $RUTAS_WEB; then
                base="https://droneobservatory.eu"
                echo "el PR no cambia la web: los recorridos van contra producción"
              else
                echo "el PR cambia la web: los recorridos van contra su vista previa (deployment_status)"
              fi
              ;;
          esac
          # Los 11 trabajos en producción (commit nuevo o reloj) y a mano; dos en los PR y en las
          # vistas previas.
          completa='[{"proyecto":"android","trozo":"1/1"},{"proyecto":"iphone","trozo":"1/1"},{"proyecto":"tableta","trozo":"1/1"},{"proyecto":"escritorio-chromium","trozo":"1/1"},{"proyecto":"escritorio-webkit","trozo":"1/1"},{"proyecto":"escritorio","trozo":"1/3"},{"proyecto":"escritorio","trozo":"2/3"},{"proyecto":"escritorio","trozo":"3/3"},{"proyecto":"movil","trozo":"1/3"},{"proyecto":"movil","trozo":"2/3"},{"proyecto":"movil","trozo":"3/3"}]'
          reducida='[{"proyecto":"escritorio-chromium","trozo":"1/1"},{"proyecto":"android","trozo":"1/1"}]'
          if [ "$produccion" = true ] || [ "$EVENTO" = workflow_dispatch ]; then
            matriz="$completa"
          else
            matriz="$reducida"
          fi
          echo "matriz=$matriz" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "produccion=$produccion" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "destino: ${base:-ninguno} (producción: $produccion); trabajos: $(jq length <<< "$matriz")"

  recorridos:
    needs: destino
    if: needs.destino.outputs.base != ''
    runs-on: ubuntu-latest
    # Preparación (dos intentos de 10 min como mucho) y recorridos (35 min), y el resto.
    timeout-minutes: 60
    env:
      # La imagen oficial de Playwright trae los tres navegadores y las librerías del sistema que
      # necesitan: nada se instala con apt en cada ejecución. El 23 y el 26 de octubre de 2026 el
      # espejo de Ubuntu de los runners servía los paquetes tan despacio que la instalación de
      # WebKit pasó de 40 minutos y el trabajo murió antes de abrir la web. La etiqueta es la versión
      # exacta de @playwright/test en web/package.json (los navegadores de la imagen son los de esa
      # versión); al subir Playwright hay que subirla aquí también.
      IMAGEN: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      # La calcula «destino»: los recorridos de una persona (e2e/*recorridos.spec.ts), cada uno en
      # su dispositivo (android, iphone, tableta, escritorio-chromium, escritorio-webkit), y el resto
      # de las comprobaciones en trozos para que ninguno pase de media hora (escritorio y movil,
      # 1/3 a 3/3); en los PR y en las vistas previas, solo escritorio-chromium y android.
      matrix:
        include: ${{ fromJSON(needs.destino.outputs.matriz) }}
    name: ${{ matrix.proyecto }} ${{ matrix.trozo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.destino.outputs.sha }}
      # La caché de npm (en los deployment_status Actions la salta: el evento no va ligado a una
      # rama; entonces npm descarga los paquetes, que es rápido).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-recorridos-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-recorridos-${{ runner.os }}-
      # Los trozos del mapa de fondo ya descargados (web/e2e/base.ts), por la huella del mapa: si
      # el mapa cambia, la caché empieza de cero. Entre ejecuciones solo se conserva en las de reloj,
      # las de PR y las manuales: en los deployment_status la caché de Actions no funciona («not tied
      # to a branch or tag ref»; tampoco dándole GITHUB_REF, probado el 27 de octubre de 2026) y la
      # carpeta empieza vacía, pero cada trozo se sigue pidiendo una sola vez por trabajo.
      - name: Huella del mapa de fondo
        id: huella
        run: |
          huella="$(python3 -c 'import json; print(json.load(open("configuracion/almacen_publico.json"))["huellas_sha256"]["europa-z14.pmtiles"])')"
          echo "huella=$huella" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/teselas"
      - name: Caché del mapa de fondo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/teselas
          key: teselas-${{ steps.huella.outputs.huella }}-${{ matrix.proyecto }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: |
            teselas-${{ steps.huella.outputs.huella }}-${{ matrix.proyecto }}-${{ strategy.job-index }}-
            teselas-${{ steps.huella.outputs.huella }}-
      # Los ficheros fijos de la web ya descargados (web/e2e/base.ts y e2e/teselas.ts): el código de
      # /assets/ con huella en el nombre y los ficheros públicos del mapa, la marca, las banderas y
      # los iconos. La clave lleva la huella de esos ficheros del repositorio: si cambian, la caché
      # empieza de cero (y base.ts solo sirve un fichero público si sus bytes son los del repositorio).
      - name: Caché de los ficheros fijos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fijos
          key: fijos-${{ hashFiles('web/public/mapa/**', 'web/public/marca/**', 'web/public/banderas/**', 'web/public/iconos/**', 'web/public/favicon.*', 'web/public/apple-touch-icon.png', 'web/public/arranque.js') }}-${{ matrix.proyecto }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: |
            fijos-${{ hashFiles('web/public/mapa/**', 'web/public/marca/**', 'web/public/banderas/**', 'web/public/iconos/**', 'web/public/favicon.*', 'web/public/apple-touch-icon.png', 'web/public/arranque.js') }}-${{ matrix.proyecto }}-${{ strategy.job-index }}-
            fijos-${{ hashFiles('web/public/mapa/**', 'web/public/marca/**', 'web/public/banderas/**', 'web/public/iconos/**', 'web/public/favicon.*', 'web/public/apple-touch-icon.png', 'web/public/arranque.js') }}-
      # La imagen y las dependencias de la web. Si algo de esto falla (red, registro, tiempo
      # agotado), se repite una vez y solo una: es un fallo antes de abrir la primera página, no de
      # la web. Sustituye al segundo intento «solo si se agota el tiempo» del 23 de octubre de 2026.
      # Las fuentes vienen en la imagen (las mismas que instalaba «playwright install --with-deps»).
      # La zona horaria y el idioma del sistema se fijan al correr los recorridos (TZ=UTC y
      # LANG=C.UTF-8, los del runner de antes): los dispositivos de Playwright no fijan ni locale
      # ni timezoneId, así que el navegador toma los del sistema, y la imagen trae otra zona.
      - name: Preparación (imagen de Playwright y dependencias)
        timeout-minutes: 22
        run: |
          set -uo pipefail
          mkdir -p ~/.npm
          preparar() {
            timeout -k 20s 8m docker pull --quiet "$IMAGEN" || return 1
            docker run --rm --name preparacion -v "$GITHUB_WORKSPACE:/w" -v "$HOME/.npm:/root/.npm" \
              -w /w/web "$IMAGEN" timeout -k 20s 8m npm ci --no-audit --no-fund
          }
          for intento in 1 2; do
            inicio=$SECONDS
            if preparar; then
              echo "preparación lista en $((SECONDS - inicio)) s (intento $intento)"
              exit 0
            fi
            echo "::warning::la preparación de los recorridos falló (intento $intento de 2)"
            docker kill preparacion > /dev/null 2>&1 || true
          done
          exit 1
      - name: Recorridos contra ${{ needs.destino.outputs.base }}
        timeout-minutes: 35
        env:
          BASE: ${{ needs.destino.outputs.base }}
          BYPASS: ${{ secrets.EODI_VERCEL_BYPASS }}
          VERCEL_BYPASS: ${{ secrets.EODI_VERCEL_BYPASS }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/capturas"
          mkdir -p "$RUNNER_TEMP/teselas" "$RUNNER_TEMP/fijos"
          docker run --rm --init --ipc=host -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP/capturas:/capturas" \
            -v "$RUNNER_TEMP/teselas:/teselas" -e TESELAS_CACHE=/teselas \
            -v "$RUNNER_TEMP/fijos:/fijos" -e FIJOS_CACHE=/fijos \
            -w /w/web -e CI -e TZ=UTC -e LANG=C.UTF-8 -e BASE -e BYPASS -e VERCEL_BYPASS -e CAPTURAS=/capturas \
            -e PLAYWRIGHT_HTML_OPEN=never "$IMAGEN" \
            npx playwright test --project=${{ matrix.proyecto }} --shard=${{ matrix.trozo }} --reporter=list,html
      # Se guarda la caché solo si alguna prueba añadió trozos: el fichero «nuevos» de base.ts, que
      # sale de la carpeta antes de guardarla.
      - name: ¿Trozos nuevos del mapa de fondo?
        id: nuevos
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/teselas/nuevos" ]; then
            mv -f "$RUNNER_TEMP/teselas/nuevos" "$RUNNER_TEMP/teselas-nuevos"
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi
          echo "caché del mapa de fondo: $(find "$RUNNER_TEMP/teselas" -name '*.bin' | wc -l) trozos, $(du -sh "$RUNNER_TEMP/teselas" | cut -f1)"
          if [ -f "$RUNNER_TEMP/fijos/nuevos" ]; then
            mv -f "$RUNNER_TEMP/fijos/nuevos" "$RUNNER_TEMP/fijos-nuevos"
            echo "fijos=true" >> "$GITHUB_OUTPUT"
          fi
          echo "caché de los ficheros fijos: $(find "$RUNNER_TEMP/fijos" -name '*.bin' | wc -l) ficheros, $(du -sh "$RUNNER_TEMP/fijos" | cut -f1)"
      - name: Guardar la caché del mapa de fondo
        if: always() && steps.nuevos.outputs.hay == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/teselas
          key: teselas-${{ steps.huella.outputs.huella }}-${{ matrix.proyecto }}-${{ strategy.job-index }}-${{ github.run_id }}
      - name: Guardar la caché de los ficheros fijos
        if: always() && steps.nuevos.outputs.fijos == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fijos
          key: fijos-${{ hashFiles('web/public/mapa/**', 'web/public/marca/**', 'web/public/banderas/**', 'web/public/iconos/**', 'web/public/favicon.*', 'web/public/apple-touch-icon.png', 'web/public/arranque.js') }}-${{ matrix.proyecto }}-${{ strategy.job-index }}-${{ github.run_id }}
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-${{ matrix.proyecto }}-${{ strategy.job-index }}
          path: web/playwright-report
          retention-days: 14

  # Tras un despliegue de producción: incidencia abierta si los recorridos fallan, cerrada si
  # vuelven a pasar. El título dice si falló la web o la preparación (.github/scripts/
  # fallo_recorridos.py, por el paso en que se paró cada trabajo). La preparación ya se ha
  # repetido una vez dentro de cada trabajo: si llega aquí, el fallo persiste tras el reintento.
  incidencia:
    needs: [destino, recorridos]
    if: always() && needs.destino.outputs.produccion == 'true' && needs.recorridos.result != 'cancelled' && needs.recorridos.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTADO: ${{ needs.recorridos.result }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          INTENTO: ${{ github.run_attempt }}
          SHA: ${{ needs.destino.outputs.sha }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          comun="Los recorridos fallan en producción"
          abiertas="$(gh issue list --state open --search "\"$comun\" in:title" --json number,title \
            --jq "map(select(.title | startswith(\"$comun\"))) | .[] | \"\(.number)\t\(.title)\"")"
          if [ "$RESULTADO" = "success" ]; then
            printf '%s\n' "$abiertas" | while IFS="$(printf '\t')" read -r numero _; do
              [ -n "$numero" ] || continue
              gh issue close "$numero" --comment "Los recorridos vuelven a pasar en producción (commit $SHA): $EJECUCION"
            done
            echo "recorridos en verde en producción"
            exit 0
          fi
          fase="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$INTENTO/jobs" --paginate \
            --jq '.jobs[]' | python3 .github/scripts/fallo_recorridos.py)"
          if [ "$fase" = "preparacion" ]; then
            titulo="$comun: la preparación"
            que="Ningún recorrido llegó a abrir la web: falló la preparación (descarga de la imagen de Playwright o de las dependencias), también en el segundo intento. No es un fallo de la web."
          else
            titulo="$comun: la web"
            que="Al menos un recorrido falló al recorrer la web."
          fi
          echo "fallo: ${fase:-desconocido} → «$titulo»"
          if [ "$EVENTO" = "schedule" ]; then cuando="en el recorrido de cada 6 horas (commit $SHA)"; else cuando="tras el despliegue del commit $SHA"; fi
          cuerpo="Los recorridos de Playwright contra https://droneobservatory.eu fallan $cuando. $que

          Ejecución e informes de Playwright (artefactos «informe-…»): $EJECUCION

          Qué hacer: interno: operacion, «Pruebas en la nube». La incidencia se cierra sola cuando un despliegue de producción vuelve a pasar los recorridos."
          numero="$(printf '%s\n' "$abiertas" | awk -F '\t' -v t="$titulo" '$2 == t { print $1; exit }')"
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body "Siguen fallando tras el commit $SHA: $EJECUCION"
          else
            gh issue create --title "$titulo" --body "$cuerpo"
          fi
