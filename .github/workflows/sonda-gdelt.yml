name: sonda-gdelt

# Temporal: comprueba desde un runner si la API DOC de GDELT responde y hasta qué
# fecha devuelve resultados. Se borra antes de mergear.
on:
  push:
    paths:
      - .github/workflows/sonda-gdelt.yml

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Consultas espaciadas con reintentos
        run: |
          python3 -u - <<'PY'
          import json, time, urllib.request, urllib.parse
          base = "https://api.gdeltproject.org/api/v2/doc/doc"
          intentos_429 = 0
          def pedir(q, extra):
              global intentos_429
              params = {"query": q, "mode": "artlist", "format": "json", "maxrecords": "250", **extra}
              url = base + "?" + urllib.parse.urlencode(params)
              for intento in range(6):
                  time.sleep(10 if intento == 0 else 30 * intento)
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          cuerpo, codigo = r.read().decode("utf-8", "replace"), r.status
                  except urllib.error.HTTPError as e:
                      codigo, cuerpo = e.code, e.read().decode("utf-8", "replace")
                  except OSError as e:
                      codigo, cuerpo = 0, repr(e)
                  print("    intento", intento, codigo, flush=True)
                  if codigo not in (0, 429):
                      break
                  intentos_429 += 1
              try:
                  arts = json.loads(cuerpo).get("articles", [])
              except Exception:
                  arts = None
              print(codigo, "intento", intento, q[:40], extra, "articulos:", None if arts is None else len(arts))
              if arts:
                  fechas = sorted(a["seendate"] for a in arts)
                  print("   ", fechas[0], fechas[-1], "|", arts[0]["language"], arts[0]["sourcecountry"], "|", arts[0]["title"][:90])
              elif arts is None:
                  print("   ", cuerpo[:200])
          q = "(drone OR drones OR Drohne OR dron) (sourcecountry:germany OR sourcecountry:poland OR sourcecountry:denmark)"
          for ini, fin in [("20250601000000", "20250602000000"), ("20250115000000", "20250116000000"),
                           ("20250101000000", "20250102000000"), ("20240115000000", "20240116000000"),
                           ("20230115000000", "20230116000000")]:
              pedir(q, {"STARTDATETIME": ini, "ENDDATETIME": fin})
          for termino in ["Drohne", "Drohnen", "drönare", "lennokki", "bezzałogowy", "дрон", "БПЛА", "dronă", "drone"]:
              pedir(termino, {"STARTDATETIME": "20250926000000", "ENDDATETIME": "20250927000000"})
          print("429 totales", intentos_429)
          PY
