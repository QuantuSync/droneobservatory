name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior de ese mismo evento: menos cola en
# los ejecutores de GitHub (el 5 de octubre de 2026 una cola de 15 minutos dejó trabajos sin máquina).
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lo que ya pasó una vez (PR #84 y #87): un PR que, al fusionarse, borra o devuelve a una versión
  # anterior ficheros que no toca a propósito. Falla si el PR, tal como está, deshace en main algo
  # que su rama no ha cambiado (está desfasado: hay que rebasarlo), o si borra ficheros de docs/,
  # esquema/, configuracion/ o tests/fixtures/ sin decirlo en su descripción con una línea
  # «Borra a propósito: <ruta>» por fichero.
  ficheros-del-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: El PR solo cambia lo que cambia a propósito
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
          DESCRIPCION: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${BASE#origin/}"
          comun="$(git merge-base "$BASE" HEAD)"
          git diff --name-only "$comun" HEAD | sort > propios.txt
          git diff --name-only "$BASE" HEAD | sort > netos.txt
          fallo=0
          revertidos="$(comm -13 propios.txt netos.txt)"
          if [ -n "$revertidos" ]; then
            echo "::error::El PR deshace en main cambios que su rama no hace (rebase sobre main):"
            printf '  %s\n' $revertidos
            fallo=1
          fi
          while IFS= read -r borrado; do
            case "$borrado" in
              docs/* | esquema/* | configuracion/* | tests/fixtures/*)
                if ! printf '%s\n' "$DESCRIPCION" | grep -qxF "Borra a propósito: $borrado"; then
                  echo "::error::El PR borra $borrado sin decirlo en su descripción («Borra a propósito: $borrado»)"
                  fallo=1
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=D "$comun" HEAD)
          [ "$fallo" -eq 0 ] && echo "el PR solo cambia lo que cambia a propósito ($(wc -l < propios.txt) ficheros)"
          exit "$fallo"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-desarrollo.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      # La exportación semanal para AEGIS, en ensayo y sin subir nada, sobre la base de prueba
      # (tests/base_prueba.py): un campo del esquema sin regla de origen la hace fallar aquí,
      # antes de fusionar, y no el lunes en el servidor.
      - name: Exportación semanal de ensayo sobre la base de prueba
        run: python -m tests.base_prueba --salida "$RUNNER_TEMP/exportacion"

  # Puerta de la web: dependencias sin vulnerabilidades altas o críticas, lint, tipos,
  # tests y build (que valida los datos contra el esquema), con los datos publicados de ejemplo
  # (tests/fixtures/publicacion): un fallo aquí es del código, no de los datos del día.
  web:
    runs-on: ubuntu-latest
    env:
      EODI_PUBLICACION: ${{ github.workspace }}/tests/fixtures/publicacion
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Lo que recibe quien pide las páginas sin ejecutar código (scripts/comprobar-paginas.ts).
      - run: node scripts/comprobar-paginas.ts
      # En un navegador real, contra el servidor local que imita el despliegue: sin código se
      # recorre la web por enlaces, y con código el texto no se pinta nunca.
      - run: npx playwright install --with-deps chromium
      - name: Páginas de texto en el navegador
        run: |
          npm run servir > "$RUNNER_TEMP/servir.log" 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:4173/ && break; sleep 1; done
          BASE=http://localhost:4173 CAPTURAS=$RUNNER_TEMP/capturas npx playwright test e2e/paginas-texto.spec.ts e2e/prevision.spec.ts --project=escritorio

  # Los datos publicados de verdad, de donde los lee la web al construirse
  # (configuracion/publicacion_web.json: el repositorio o el almacén público): la barrera de
  # titulares y la validación de la web sobre ellos. Si el almacén no responde, falla: es lo mismo
  # que haría el build de producción.
  datos-publicados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-desarrollo.txt
      - run: npm ci
        working-directory: web
      - name: Bajar los datos publicados
        working-directory: web
        run: echo "EODI_PUBLICACION=$(node scripts/publicacion.ts | tail -n 1)" >> "$GITHUB_ENV"
      - name: Barrera de titulares sobre los datos publicados
        run: pytest -q tests/test_cita_titular.py
      - name: La web valida los datos publicados
        working-directory: web
        run: |
          node scripts/datos.ts
          npx vitest run tests/datos.test.ts tests/jornadas.test.ts tests/prevision.test.tsx

  # La recogida la lanza cada hora un servidor propio, que al final de cada una publica
  # estado.json en el almacén público. Este trabajo señala en su resumen si la última
  # recogida correcta tiene más de dos horas. Solo informa: no lanza nada ni hace fallar
  # los tests.
  salud-recogida:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Última recogida correcta según estado.json
        run: python -m recogida.salud
