name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-desarrollo.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  # GitHub retrasa o se salta ejecuciones programadas sin avisar. Este trabajo señala en
  # su resumen si la última recogida correcta tiene más de seis horas y si no hay ningún
  # reloj en marcha ni lo ha habido en las dos últimas horas. Solo informa: no lanza nada
  # ni hace fallar los tests.
  salud-recogida:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Última recogida correcta y reloj en marcha
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Una consulta que falla deja su fichero vacío y se cuenta como «no se sabe».
          gh run list --workflow recogida.yml --status success --limit 1 \
            --json updatedAt > "$RUNNER_TEMP/recogida.json" || true
          gh run list --workflow reloj.yml --limit 20 \
            --json status,updatedAt > "$RUNNER_TEMP/reloj.json" || true
          python -m recogida.salud --recogida "$RUNNER_TEMP/recogida.json" \
            --reloj "$RUNNER_TEMP/reloj.json"
