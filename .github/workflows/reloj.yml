name: reloj

# Reloj propio de la recogida. GitHub se salta la mayoría de las ejecuciones programadas,
# pero no las lanzadas a demanda, y el token de una ejecución puede lanzar
# workflow_dispatch. Un trabajo se queda esperando y lanza recogida.yml a demanda en el
# minuto 17 de cada hora; como ningún trabajo puede durar más de seis horas, va por turnos
# de cinco horas y media y, al acabar el suyo, lanza el turno siguiente (recogida/reloj.py).
#
# La programación horaria es solo un respaldo: arranca un turno si no hay ningún reloj en
# marcha. Va en el minuto 47, a media hora del lanzamiento de la recogida.
# Solo eventos del propio repositorio: nunca pull_request ni pull_request_target.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

# Lo justo para consultar y lanzar ejecuciones. El repositorio es público: el código se
# descarga sin permiso de contenidos.
permissions:
  actions: write

jobs:
  guardia:
    if: github.repository == 'QuantuSync/droneobservatory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Una consulta a la API: segundos.
    timeout-minutes: 5
    outputs:
      arrancar: ${{ steps.guardia.outputs.arrancar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Decidir si esta ejecución arranca un turno
        id: guardia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
        run: python -m recogida.reloj guardia --evento "$EVENTO"

  turno:
    needs: guardia
    if: needs.guardia.outputs.arrancar == 'true'
    runs-on: ubuntu-latest
    # Un solo reloj a la vez. El relevo espera aquí los segundos que tarda en acabar el
    # turno que lo lanzó; el que está en marcha nunca se cancela.
    concurrency:
      group: reloj
      cancel-in-progress: false
    # El turno dura cinco horas y media (DURACION_TURNO en recogida/reloj.py). Quince
    # minutos más de margen, por debajo de las seis horas a las que GitHub corta un trabajo.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Lanzar la recogida cada hora y, al final, el turno siguiente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m recogida.reloj turno
